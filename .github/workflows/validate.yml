name: Validate Extended SRS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 schemadocs-generator/generate.py --check
      - run: python3 -m unittest discover -s schemadocs-generator -p 'test_*.py'
      - run: npm ci
      - run: npm run check:style
      - run: npm --prefix extended-srs-core ci
      - run: npm --prefix extended-srs-core run build
      - run: npm --prefix extended-srs-core run test:coverage
      - run: npm --prefix mcp-server ci
      - run: npm --prefix mcp-server run test:coverage
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: user.useConfigOnly
          GIT_CONFIG_VALUE_0: 'true'
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            extended-srs-core/coverage/
            mcp-server/coverage/
          retention-days: 14
          if-no-files-found: ignore
